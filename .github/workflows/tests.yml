name: Preserved readiness & unified regressions

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:vendor
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Compile Python files
        run: python -m compileall -q scripts tests src
      - name: Run all unittest suites
        run: python -m unittest discover -s tests -v
