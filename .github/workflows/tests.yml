name: Project checks

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Compile Python files
        run: python -m compileall -q src scripts tests vendor
      - name: Run unit tests
        run: python -m unittest tests/test_site.py tests/test_refresh_feed.py tests/test_validate_submission.py tests/test_h87_end_to_end.py -v
