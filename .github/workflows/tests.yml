name: Preserved readiness & unified regressions

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:vendor
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Restore hash-pinned validation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHON="$(command -v python)" ./scripts/download_competition_data.sh --ids sample_submission,existing_faults
      - name: Compile Python files
        run: python -m compileall -q scripts tests src vendor prepare_data.py
      - name: Run all unittest suites
        run: python -m unittest discover -s tests -v
