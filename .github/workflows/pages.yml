name: Refresh source feed and publish site

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "executive-summary.html"
      - "research.html"
      - "sources.html"
      - "assets/**"
      - "data/**"
      - "docs/**"
      - "scripts/refresh_feed.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out published source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble static site
        run: |
          mkdir -p _site/data _site/assets _site/docs
          cp index.html executive-summary.html research.html sources.html README.md _site/
          cp -R assets/. _site/assets/
          cp data/sources.json data/submission-status.json data/run-card.json _site/data/
          cp docs/experiment-plan.md docs/score-claim-audit.md docs/source-audit.md docs/irregularities.md docs/review-log.md _site/docs/
          python scripts/refresh_feed.py --config data/sources.json --output _site/data/feed.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
