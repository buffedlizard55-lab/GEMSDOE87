name: Pages and read-only source feed

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install only the static-site and public-health dependencies
        run: python -m pip install 'Markdown==3.11.2' 'requests==2.34.2'
      - name: Refresh public transport health and derived next steps
        run: |
          python scripts/update_feed.py
          python scripts/update_next_steps.py
          python scripts/build_prior_catalog.py
          python scripts/build_site.py
          python scripts/check_site.py
      - name: Stage only public site files and compatible entry points
        run: |
          mkdir -p .cache/pages-publish
          cp -r docs .cache/pages-publish/docs
          cp index.html executive-summary.html .nojekyll .cache/pages-publish/
      - name: Configure existing Pages site for the deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)"
          if [[ "$mode" != "workflow" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" --raw-field build_type=workflow
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/pages-publish
      - name: Publish validated static pages
        id: deployment
        uses: actions/deploy-pages@v4
