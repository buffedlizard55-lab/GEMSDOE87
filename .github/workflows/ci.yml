name: Research artifact checks

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked validation dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore only the two small hash-pinned validation inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHON="$(command -v python)" ./scripts/download_competition_data.sh --ids sample_submission,existing_faults
      - name: Reopen the actual TIFF and ZIP
        run: python scripts/check_submission.py --format-only
      - name: Verify independent byte and gate preflight receipt
        run: |
          python - <<'PY'
          import json, subprocess, sys
          card = json.loads(open('run_card.json').read())
          result = subprocess.run([sys.executable, 'scripts/check_submission.py'], capture_output=True, text=True)
          expect_rc = 0 if card.get('safe_to_submit') is True else 2
          assert result.returncode == expect_rc, result.stdout + result.stderr
          report = json.loads(result.stdout)
          assert report['local_format_valid'] is True
          assert report['safe_to_submit'] is bool(card.get('safe_to_submit'))
          print(f'Verified check_submission exit={result.returncode}, safe_to_submit={report["safe_to_submit"]}.')
          PY
      - name: Synthetic regressions, shared-tool pins and frozen artifact tests
        run: |
          mkdir -p .cache
          python -m pytest -q --junitxml=.cache/software-tests.xml
          python -m compileall -q src scripts vendor tests prepare_data.py
          bash -n scripts/download_competition_data.sh
          python prepare_data.py --help
      - name: Build and audit static site without a scientific rerun
        run: |
          python scripts/update_next_steps.py
          python scripts/build_prior_catalog.py
          python scripts/build_site.py
          python scripts/check_site.py
      - name: Real Chromium — download hash, 4 viewport widths, clipboard and failure cases
        run: npm run test:browser
      - name: Retain actual check receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-software-verification
          path: |
            .cache/software-tests.xml
            .cache/browser-audit/desktop.png
            .cache/browser-audit/mobile.png
            docs/evidence/browser_validation.json
            docs/evidence/independent_validation.json
            docs/evidence/site_validation.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
