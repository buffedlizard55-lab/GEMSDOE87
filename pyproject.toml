[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe87"
version = "0.1.0"
description = "Auditable, leakage-controlled GEMS GeoTIFF research and submission pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "rasterio>=1.3,<2",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
